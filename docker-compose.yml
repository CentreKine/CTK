version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: clinic_finance_db
    environment:
      POSTGRES_USER: clinic_admin
      POSTGRES_PASSWORD: "SecurePass123!@#"
      POSTGRES_DB: clinic_finance_db
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=fr_FR.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    networks:
      - clinic_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic_admin -d clinic_finance_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

networks:
  clinic_network:
    driver: bridge
