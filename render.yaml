# Render services configuration for CTK (web + api)

services:
  - type: web
    name: clinic-finance-web
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: VITE_API_BASE
        value: https://clinic-finance-rdnz.onrender.com/api
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

  - type: web
    name: clinic-finance-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn single_db_api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATA_FILE
        # store data.json in a writable path provided by Render. You can override this if you mount a persistent volume.
        value: data.json
      - key: PORT
        value: 8000
